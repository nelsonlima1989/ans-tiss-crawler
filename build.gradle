plugins {
    id 'groovy'
    id 'application'
}

group = 'com.anstiss'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.codehaus.groovy:groovy-all:3.0.24'
    implementation 'io.github.http-builder-ng:http-builder-ng-core:1.0.4'
    implementation 'org.jsoup:jsoup:1.21.2'

    testImplementation 'org.spockframework:spock-core:2.4-groovy-3.0'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.anstiss.Main'
}

test {
    useJUnitPlatform()
}